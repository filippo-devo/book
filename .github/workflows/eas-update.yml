name: EAS Update

# Publishes an over-the-air update to EAS on every push to main.
# Requires the EXPO_TOKEN repository secret (expo.dev → Account settings → Access tokens).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: eas-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish EAS Update
    runs-on: ubuntu-latest
    steps:
      - name: Check for EXPO_TOKEN
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error::Missing EXPO_TOKEN secret. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Links (or on the first run creates) the @<account>/przystan project on expo.dev.
      # Writes extra.eas.projectId into app.json for this run only.
      - name: Link EAS project
        run: eas init --non-interactive --force

      - name: Publish update
        run: eas update --auto --non-interactive --environment production --platform all
